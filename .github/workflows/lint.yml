name: Lint

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:
    # Allow manual triggering of the linting

permissions:
  contents: read

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    name: Lint Markdown

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v4
        with:
          node-version: "20"

      - name: Verify markdown files
        # Verify all markdown files pass linting (no auto-fix in CI)
        # This catches commits that bypassed the pre-commit hook
        run: npx markdownlint-cli2 "**/*.md"
