name: Lint

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:
    # Allow manual triggering of the linting

permissions:
  contents: read

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    name: Lint Markdown

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: "20"

      - name: Verify markdown files
        # Verify all markdown files pass linting (no auto-fix in CI)
        # This catches commits that bypassed the pre-commit hook
        run: npx markdownlint-cli2 "**/*.md"
