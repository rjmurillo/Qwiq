# Copilot Setup Steps Workflow
#
# This workflow provides GitHub CLI access for GitHub Copilot agents to monitor
# workflows, view logs, and interact with the repository programmatically.
#
# The GH_TOKEN environment variable enables gh CLI commands without authentication.
# Copilot agents can use this workflow to:
# - View workflow run logs: gh run view <run-id> --log
# - Monitor PR checks: gh pr checks <pr-number>
# - Check workflow status: gh run list --workflow=main.yml
# - Debug failed runs: gh run download <run-id>

name: Copilot Setup Steps

on:
  workflow_dispatch:
    # Allow manual triggering for testing
  workflow_call:
    # Allow this workflow to be called by other workflows

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  setup:
    name: Copilot Setup and Monitoring
    runs-on: ubuntu-latest

    env:
      # Enable GitHub CLI for GitHub agents or scripts
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Verify GitHub CLI availability
        run: |
          echo "✓ GitHub CLI is available"
          gh --version
          echo ""
          echo "✓ GH_TOKEN is configured"
          echo "✓ Copilot agents can now use gh commands"

      - name: Example - List recent workflow runs
        run: |
          echo "Recent workflow runs:"
          gh run list --limit 5 || echo "No recent runs or insufficient permissions"

      - name: Example - Show repository info
        run: |
          echo "Repository information:"
          gh repo view --json name,description,url,defaultBranch
