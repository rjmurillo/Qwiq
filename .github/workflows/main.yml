name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest

    env:
      # Test filter matching AppVeyor configuration
      TEST_FILTER: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST&TestCategory!=IntegrationTests"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore Qwiq.sln

      - name: Build solution
        run: dotnet build Qwiq.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true /m:1 /nodeReuse:false /bl:./artifacts/logs/build.binlog

      - name: Verify NuGet packages
        run: |
          $nupkgs = Get-ChildItem -Path src -Recurse -Filter "*.nupkg" -File | Where-Object { $_.FullName -match "bin\\Release" -and $_.FullName -notmatch "\\.symbols\\.nupkg$" }
          if ($nupkgs.Count -eq 0) {
            Write-Error "No NuGet packages were generated for verification."
            exit 1
          }

          foreach ($package in $nupkgs) {
            Write-Host "Verifying package integrity for $($package.Name)"
            dotnet nuget verify $package.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Verification failed for $($package.Name)"
              exit 1
            }
          }

          $snupkgs = Get-ChildItem -Path src -Recurse -Filter "*.snupkg" -File | Where-Object { $_.FullName -match "bin\\Release" }
          foreach ($symbol in $snupkgs) {
            Write-Host "Verifying symbol package integrity for $($symbol.Name)"
            dotnet nuget verify $symbol.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Verification failed for symbol package $($symbol.Name)"
              exit 1
            }
          }

          Write-Host "NuGet package verification complete for $($nupkgs.Count) packages and $($snupkgs.Count) symbol packages."

      - name: Verify Source Link
        run: |
          $packages = Get-ChildItem -Path src -Recurse -Filter "*.snupkg" -File | Where-Object { $_.FullName -match "bin\\Release" }
          foreach ($package in $packages) {
            Write-Host "Testing Source Link in: $($package.Name)"
            dotnet sourcelink test $package.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Source Link validation failed for $($package.Name)"
              exit 1
            }
          }
          Write-Host "All $($packages.Count) symbol packages passed Source Link validation"

      - name: Run tests with coverage
        id: test
        run: dotnet test Qwiq.sln -c Release --no-build --filter "${{ env.TEST_FILTER }}" --logger trx --results-directory ./artifacts/TestResults --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Upload build logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./artifacts/logs/
          if-no-files-found: ignore

      - name: Generate coverage report
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        run: dotnet reportgenerator -reports:"./artifacts/TestResults/**/coverage.cobertura.xml" -targetdir:"./artifacts/CoverageReport" -reporttypes:"Cobertura;HtmlSummary;HtmlInline_AzurePipelines"

      - name: Upload test results
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./artifacts/CoverageReport/
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: binaries
          path: |
            src/**/bin/Release/**/*.dll
            src/**/bin/Release/**/*.exe
            !src/**/bin/Release/**/*.pdb
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: packages
          path: |
            src/**/bin/Release/**/*.nupkg
            src/**/bin/Release/**/*.snupkg
          if-no-files-found: warn
