name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    
    env:
      # Test filter matching AppVeyor configuration
      TEST_FILTER: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        # Use NuGet 5.x for compatibility with packages.config-based projects
        # NuGet 7.x has stricter NU5012 errors when packing with packages.config
        nuget-version: '5.11.0'

    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1.3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: |
        # First restore using nuget.exe which handles packages.config correctly
        nuget restore Qwiq.sln -NonInteractive -PackagesDirectory packages -ConfigFile nuget.config
        
        # Also restore each packages.config individually to ensure all dependencies are resolved
        Get-ChildItem -Path . -Recurse -Filter packages.config | ForEach-Object {
          Write-Host "Restoring packages from: $($_.FullName)"
          nuget restore $_.FullName -PackagesDirectory packages -ConfigFile nuget.config
        }
      shell: pwsh
      continue-on-error: false

    - name: Build solution
      run: msbuild Qwiq.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /m

    - name: Prepare NuGet dependency .nupkg files for packing
      shell: pwsh
      run: |
        # nuget pack requires .nupkg files for dependencies when processing packages.config
        # nuget restore only extracts packages to folders, so we use nuget install with
        # -PackageSaveMode nupkg to preserve the .nupkg files that nuget pack needs
        $root = $PWD
        $packagesDir = Join-Path $root 'packages'

        Write-Host "Creating packages directory at $packagesDir"
        New-Item -ItemType Directory -Force -Path $packagesDir | Out-Null

        # For every packages.config, install its packages into our local packages folder
        Get-ChildItem -Recurse -Filter 'packages.config' | ForEach-Object {
          $configPath = $_.FullName
          Write-Host "Installing packages from $configPath"

          nuget install $configPath `
            -OutputDirectory $packagesDir `
            -PackageSaveMode nupkg `
            -NonInteractive
        }

    - name: Pack NuGet packages
      shell: pwsh
      run: |
        # Pack each project that has a nuspec file
        # -PackagesDirectory points to the folder with .nupkg files created by nuget install
        # -IncludeReferencedProjects includes referenced project outputs in the package
        $root = $PWD
        $packagesDir = Join-Path $root 'packages'

        Get-ChildItem -Path "src" -Recurse -Filter "*.nuspec" | ForEach-Object {
          $projectDir = $_.DirectoryName
          $projectName = (Get-ChildItem -Path $projectDir -Filter "*.csproj" | Select-Object -First 1).BaseName
          Write-Host "Packing: $projectName"
          nuget pack "$projectDir\$projectName.csproj" `
            -Properties Configuration=Release `
            -OutputDirectory "$projectDir\bin\Release" `
            -IncludeReferencedProjects `
            -PackagesDirectory $packagesDir `
            -NonInteractive
        }

    - name: Run tests
      shell: pwsh
      run: |
        # Find all test assemblies (excluding IntegrationTests)
        $testAssemblies = @(
          Get-ChildItem -Path "test" -Recurse -Filter "*Tests.dll" | 
          Where-Object { 
            $_.FullName -match "bin\\Release" -and 
            $_.FullName -notmatch "IntegrationTests" -and
            $_.FullName -notmatch "\\ref\\" 
          }
        )
        
        if ($testAssemblies.Count -eq 0) {
          Write-Warning "No test assemblies found!"
          exit 1
        }
        
        Write-Host "Found $($testAssemblies.Count) test assemblies"
        
        foreach ($assembly in $testAssemblies) {
          Write-Host "Testing: $($assembly.FullName)"
          vstest.console.exe $assembly.FullName /Logger:trx /TestCaseFilter:"$env:TEST_FILTER"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Tests failed in $($assembly.Name) with exit code $LASTEXITCODE"
          }
        }

    - name: Copy NuGet packages for package tests
      shell: pwsh
      run: |
        $packageTestDir = "test/Qwiq.Package.Tests/bin/Release/net8.0"
        New-Item -ItemType Directory -Force -Path $packageTestDir | Out-Null
        Get-ChildItem -Path "src" -Recurse -Filter "*.nupkg" | ForEach-Object {
          Write-Host "Copying: $($_.FullName) to $packageTestDir"
          Copy-Item $_.FullName -Destination $packageTestDir
        }

    - name: Run package tests
      shell: pwsh
      run: |
        dotnet test test/Qwiq.Package.Tests/Qwiq.Package.Tests.csproj --configuration Release --logger trx --results-directory TestResults

    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx
        if-no-files-found: ignore

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: binaries
        path: |
          src/**/bin/Release/**/*.dll
          src/**/bin/Release/**/*.exe
          !src/**/bin/Release/**/*.pdb
        if-no-files-found: warn
