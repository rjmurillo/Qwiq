name: Main build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  merge_group:
    branches:
      - develop
      - master

permissions:
  security-events: write  # required for CodeQL
  packages: read
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Restore NuGet packages
      run: nuget restore Qwiq.sln -NonInteractive -DisableParallelProcessing

    - name: Build solution
      run: msbuild Qwiq.sln /p:Configuration=Release /p:Platform="Any CPU" /m:1 /nr:false /p:UseSharedCompilation=false /verbosity:minimal

    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1.2

    - name: Run tests
      run: |
        $testAssemblies = Get-ChildItem -Path . -Recurse -Filter "*Tests.dll" | 
          Where-Object { 
            $_.FullName -match "\\bin\\Release\\" -and 
            $_.FullName -notmatch "IntegrationTests" -and
            $_.FullName -notmatch "Benchmark"
          } |
          Select-Object -ExpandProperty FullName
        
        if ($testAssemblies) {
          foreach ($assembly in $testAssemblies) {
            Write-Host "Testing: $assembly"
            vstest.console.exe $assembly /Logger:trx /TestCaseFilter:"TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST"
          }
        } else {
          Write-Host "No test assemblies found"
        }
      shell: pwsh
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results
        path: |
          **/*.trx
        if-no-files-found: ignore

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: packages
        path: |
          **/*.nupkg
        if-no-files-found: ignore

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: binaries
        path: |
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.exe
        if-no-files-found: warn
