name: Main build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  merge_group:
    branches:
      - develop
      - master

permissions:
  security-events: write  # required for CodeQL
  packages: read
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Setup MSBuild (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup Mono (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-complete msbuild
      shell: bash

    - name: Run init.ps1 (Windows)
      if: runner.os == 'Windows'
      run: .\init.ps1
      shell: pwsh

    - name: Run init.ps1 (Ubuntu)
      if: runner.os == 'Linux'
      run: pwsh ./init.ps1
      shell: bash
      continue-on-error: true

    - name: Restore NuGet packages
      run: nuget restore Qwiq.sln -NonInteractive
      continue-on-error: ${{ runner.os == 'Linux' }}

    - name: Build solution (Windows)
      if: runner.os == 'Windows'
      run: msbuild Qwiq.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /maxcpucount

    - name: Build solution (Ubuntu)
      if: runner.os == 'Linux'
      run: msbuild Qwiq.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /maxcpucount
      shell: bash
      continue-on-error: true

    - name: Setup VSTest (Windows)
      if: runner.os == 'Windows'
      uses: darenm/Setup-VSTest@v1.2

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: |
        $testAssemblies = Get-ChildItem -Path . -Recurse -Filter "*Tests.dll" | 
          Where-Object { 
            $_.FullName -match "\\bin\\Release\\" -and 
            $_.FullName -notmatch "IntegrationTests" -and
            $_.FullName -notmatch "Benchmark"
          } |
          Select-Object -ExpandProperty FullName
        
        if ($testAssemblies) {
          foreach ($assembly in $testAssemblies) {
            Write-Host "Testing: $assembly"
            vstest.console.exe $assembly /Logger:trx /TestCaseFilter:"TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST"
          }
        } else {
          Write-Host "No test assemblies found"
        }
      shell: pwsh
      continue-on-error: true

    - name: Run tests (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        echo "Note: .NET Framework 4.6 tests are not fully supported on Linux/Mono"
        find . -name "*Tests.dll" -path "*/bin/Release/*" ! -path "*IntegrationTests*" -exec echo "Found test assembly: {}" \;
      shell: bash
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results-${{ matrix.os }}
        path: |
          **/*.trx
        if-no-files-found: ignore

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: packages-${{ matrix.os }}
        path: |
          **/*.nupkg
        if-no-files-found: ignore

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: binaries-${{ matrix.os }}
        path: |
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.exe
        if-no-files-found: warn
