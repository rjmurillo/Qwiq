name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest

    env:
      # Test filter matching AppVeyor configuration
      TEST_FILTER: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST&TestCategory!=IntegrationTests"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore Qwiq.sln

      - name: Build solution
        run: dotnet build Qwiq.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true /m:1 /nodeReuse:false /bl:./artifacts/logs/build.binlog

      - name: Verify Source Link
        # Only run on push events (develop/master), not on pull_request events.
        # During PR checks, GitHub creates a temporary merge commit that sourcelink
        # cannot validate because the commit doesn't persist on GitHub's raw content server.
        if: github.event_name == 'push'
        run: |
          # sourcelink test works with .pdb files, not .snupkg files
          # We test the PDB files directly from the Release output directories
          $pdbs = Get-ChildItem -Path src -Recurse -Filter "*.pdb" -File | Where-Object { $_.FullName -match "bin\\Release" }
          $failed = 0
          foreach ($pdb in $pdbs) {
            Write-Host "Testing Source Link in: $($pdb.Name)"
            dotnet sourcelink test $pdb.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Source Link validation failed for $($pdb.Name)"
              $failed++
            }
          }
          if ($failed -gt 0) {
            Write-Error "$failed PDB files failed Source Link validation"
            exit 1
          }
          Write-Host "All $($pdbs.Count) PDB files passed Source Link validation"

      - name: Run tests with coverage
        id: test
        run: dotnet test Qwiq.sln -c Release --no-build --filter "${{ env.TEST_FILTER }}" --logger trx --results-directory ./artifacts/TestResults --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Upload build logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./artifacts/logs/
          if-no-files-found: ignore

      - name: Generate coverage report
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        run: dotnet reportgenerator -reports:"./artifacts/TestResults/**/coverage.cobertura.xml" -targetdir:"./artifacts/CoverageReport" -reporttypes:"Cobertura;HtmlSummary;HtmlInline_AzurePipelines"

      - name: Upload test results
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./artifacts/CoverageReport/
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: binaries
          path: |
            src/**/bin/Release/**/*.dll
            src/**/bin/Release/**/*.exe
            !src/**/bin/Release/**/*.pdb
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: packages
          path: |
            src/**/bin/Release/**/*.nupkg
            src/**/bin/Release/**/*.snupkg
          if-no-files-found: warn
