name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    env:
      # Test filter matching AppVeyor configuration
      TEST_FILTER: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST&TestCategory!=IntegrationTests"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore Qwiq.sln

      - name: Build and pack solution
        # Windows: Use -t:Build,Pack to ensure all packages are generated during build.
        # This produces packages for all target frameworks including net472.
        #
        # Linux: Use solution-level build with GeneratePackageOnBuild=false.
        # Linux cannot build net472 (requires Windows/.NET Framework), so we skip packing.
        # The SDK automatically filters out Windows-only TFMs during inner builds.
        # Packages are only produced on Windows where all TFMs can be built.
        #
        # Note: Use -t: instead of /t: for cross-platform bash compatibility.
        # Use -p: instead of /p: for the same reason.
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            dotnet build Qwiq.sln -c Release --no-restore -t:Build,Pack -p:ContinuousIntegrationBuild=true -m:1 -nodeReuse:false -bl:./artifacts/logs/build.binlog
          else
            # Linux: Build solution without packing (net472 cannot be built on Linux)
            dotnet build Qwiq.sln -c Release --no-restore -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true -m:1 -nodeReuse:false -bl:./artifacts/logs/build.binlog
          fi
        shell: bash

      - name: Validate package output
        # Scans csproj files to find packable projects and validates each produced
        # both .nupkg and .snupkg files. Fails the build if any are missing.
        # Only run on Windows (Linux builds don't generate all packages)
        if: matrix.os == 'windows-latest'
        run: ./build/scripts/Validate-PackageOutput.ps1

      - name: Verify Source Link
        # Only run on push events (develop/master), not on pull_request events.
        # During PR checks, GitHub creates a temporary merge commit that sourcelink
        # cannot validate because the commit doesn't persist on GitHub's raw content server.
        # Only run on Windows builds (Linux builds don't generate all packages)
        if: github.event_name == 'push' && matrix.os == 'windows-latest'
        run: ./build/scripts/Verify-SourceLink.ps1

      - name: Run tests with coverage
        id: test
        # Run tests for all projects that were built.
        # The test filter excludes integration tests that require server connectivity.
        # On Linux, net472 test projects are skipped automatically since they weren't built.
        run: dotnet test Qwiq.sln -c Release --no-build --filter "${{ env.TEST_FILTER }}" --logger trx --results-directory ./artifacts/TestResults --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Upload build logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: ./artifacts/logs/
          if-no-files-found: ignore

      - name: Generate coverage report
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        run: dotnet reportgenerator -reports:"./artifacts/TestResults/**/coverage.cobertura.xml" -targetdir:"./artifacts/CoverageReport" -reporttypes:"Cobertura;HtmlSummary;HtmlInline_AzurePipelines"

      - name: Upload test results
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: ./artifacts/CoverageReport/
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: binaries-${{ matrix.os }}
          path: |
            src/**/bin/Release/**/*.dll
            src/**/bin/Release/**/*.exe
            !src/**/bin/Release/**/*.pdb
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v4
        # Only upload packages from Windows build (Linux doesn't build all packages)
        if: success() && matrix.os == 'windows-latest'
        with:
          name: packages
          path: |
            src/**/bin/Release/**/*.nupkg
            src/**/bin/Release/**/*.snupkg
            test/**/bin/Release/**/*.nupkg
            test/**/bin/Release/**/*.snupkg
          if-no-files-found: warn
