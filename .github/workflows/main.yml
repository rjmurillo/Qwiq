name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    
    env:
      # Test filter matching AppVeyor configuration
      TEST_FILTER: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST"
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup .NET Tool Manifest (NBGV)
      run: dotnet tool restore
      shell: pwsh

    - name: Display NBGV Version
      run: dotnet nbgv get-version
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore Qwiq.sln
      shell: pwsh

    - name: Build solution
      run: dotnet build Qwiq.sln --configuration Release --no-restore
      shell: pwsh

    - name: Run tests
      run: dotnet test Qwiq.sln --configuration Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults
      shell: pwsh
      continue-on-error: true

    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx
        if-no-files-found: ignore

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: binaries
        path: |
          src/**/bin/Release/**/*.dll
          src/**/bin/Release/**/*.exe
          !src/**/bin/Release/**/*.pdb
        if-no-files-found: warn
