name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu
            test_filter: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST&TestCategory!=IntegrationTests"
            test_framework_arg: "--framework net8.0"
            binaries_name: binaries-net8
            binaries_path: |
              src/**/bin/Release/net8.0/**/*.dll
              !src/**/bin/Release/net8.0/**/*.pdb
            pack_packages: false
          - os: windows-latest
            name: windows
            test_filter: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=IntegrationTests"
            test_framework_arg: ""
            binaries_name: binaries-net472
            binaries_path: |
              src/**/bin/Release/net472/**/*.dll
              !src/**/bin/Release/net472/**/*.pdb
            pack_packages: true

    runs-on: ${{ matrix.os }}

    env:
      TEST_FILTER: ${{ matrix.test_filter }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore Qwiq.sln

      - name: Build solution
        run: dotnet build Qwiq.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:Deterministic=true /p:UseSharedCompilation=false /p:BuildInParallel=false /m:1 /nodeReuse:false /bl:./artifacts/logs/build.${{ matrix.name }}.binlog

      - name: Pack NuGet packages
        if: matrix.pack_packages
        run: dotnet pack Qwiq.sln -c Release --no-build /p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: |
          dotnet test test/Qwiq.Core.Tests/Qwiq.Core.UnitTests.csproj -c Release --no-build ${{ matrix.test_framework_arg }} --logger trx --results-directory ./artifacts/TestResults --filter "${{ env.TEST_FILTER }}"
          dotnet test test/Qwiq.Identity.Tests/Qwiq.Identity.UnitTests.csproj -c Release --no-build ${{ matrix.test_framework_arg }} --logger trx --results-directory ./artifacts/TestResults --filter "${{ env.TEST_FILTER }}"
          dotnet test test/Qwiq.Linq.Tests/Qwiq.Linq.UnitTests.csproj -c Release --no-build ${{ matrix.test_framework_arg }} --logger trx --results-directory ./artifacts/TestResults --filter "${{ env.TEST_FILTER }}"
          dotnet test test/Qwiq.Mapper.Tests/Qwiq.Mapper.UnitTests.csproj -c Release --no-build ${{ matrix.test_framework_arg }} --logger trx --results-directory ./artifacts/TestResults --filter "${{ env.TEST_FILTER }}"

      - name: Upload build logs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          path: ./artifacts/logs/
          if-no-files-found: ignore

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ./artifacts/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.binaries_name }}
          path: ${{ matrix.binaries_path }}
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: matrix.pack_packages && success()
        with:
          name: packages
          path: |
            src/**/bin/Release/**/*.nupkg
            src/**/bin/Release/**/*.snupkg
          if-no-files-found: warn
