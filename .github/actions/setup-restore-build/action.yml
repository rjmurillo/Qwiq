name: Setup, Restore, and Build Solution
description: Sets up build tools, restores NuGet packages, and builds the solution (Windows only)

runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Initialize Environment
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}/init.ps1") {
          & "${{ github.workspace }}/init.ps1"
        }

    - name: Restore NuGet packages
      shell: pwsh
      run: nuget restore "${{ github.workspace }}/Qwiq.sln" -NonInteractive -DisableParallelProcessing

    - name: Build Solution
      shell: pwsh
      run: |
        $artifactsPath = "${{ github.workspace }}/artifacts/logs"
        New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
        msbuild "${{ github.workspace }}/Qwiq.sln" /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /maxcpucount /bl:"$artifactsPath/build.binlog"
