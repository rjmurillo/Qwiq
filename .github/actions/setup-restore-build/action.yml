name: Setup, Restore, and Build Solution
description: Sets up build tools, restores NuGet packages, and builds the solution (Windows only)

runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Initialize Environment
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}/init.ps1") {
          & "${{ github.workspace }}/init.ps1"
        }

    - name: Restore NuGet packages
      shell: pwsh
      run: nuget restore "${{ github.workspace }}/Qwiq.sln" -NonInteractive -DisableParallelProcessing

    - name: Remove incompatible MSBuild tasks
      shell: pwsh
      run: |
        # Remove GitVersionTask 4.0.0 which is incompatible with MSBuild 17.x on windows-2022
        # The workflow already uses GitVersion.Tool separately, so this is redundant
        $gitVersionTaskPath = "${{ github.workspace }}/packages/GitVersionTask.*"
        if (Test-Path $gitVersionTaskPath) {
          Write-Host "Removing GitVersionTask package to avoid MSBuild internal error"
          Remove-Item -Recurse -Force $gitVersionTaskPath
        }

    - name: Build Solution
      shell: pwsh
      run: |
        $artifactsPath = "${{ github.workspace }}/artifacts/logs"
        New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
        # Disable parallelism to avoid MSBuild engine races with older tasks
        msbuild "${{ github.workspace }}/Qwiq.sln" /p:Configuration=Release /p:Platform="Any CPU" /p:WarningsNotAsErrors=NU1902 /verbosity:minimal /m:1 /nr:false /p:BuildInParallel=false /p:UseSharedCompilation=false /bl:"$artifactsPath/build.binlog"
