name: Setup, Restore, and Build Solution
description: Sets up build tools, restores NuGet packages, and builds the solution (Windows only)

runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Initialize Environment
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}/init.ps1") {
          & "${{ github.workspace }}/init.ps1"
        }

    - name: Restore NuGet packages
      shell: pwsh
      run: nuget restore "${{ github.workspace }}/Qwiq.sln" -NonInteractive -DisableParallelProcessing

    - name: Remove incompatible MSBuild packages
      shell: pwsh
      run: |
        # Remove GitVersionTask 4.0.0 and Microsoft.Net.Compilers 2.10.0 which are incompatible with MSBuild 17.x
        # The workflow already uses GitVersion.Tool separately, so GitVersionTask is redundant
        # MSBuild 17.x has built-in Roslyn compilers, so Microsoft.Net.Compilers is also redundant
        Write-Host "Removing incompatible MSBuild packages..."
        $pkgRoot = Join-Path $Env:GITHUB_WORKSPACE 'packages'
        
        if (Test-Path $pkgRoot) {
          # Remove GitVersionTask
          $gv = Get-ChildItem -Path $pkgRoot -Directory -Filter 'GitVersionTask.*' -ErrorAction SilentlyContinue
          if ($gv) {
            $gv | ForEach-Object { 
              Write-Host "Removing: $($_.FullName)"
              Remove-Item -Recurse -Force $_.FullName 
            }
          }
          
          # Remove Microsoft.Net.Compilers
          $compiler = Get-ChildItem -Path $pkgRoot -Directory -Filter 'Microsoft.Net.Compilers.*' -ErrorAction SilentlyContinue
          if ($compiler) {
            $compiler | ForEach-Object { 
              Write-Host "Removing: $($_.FullName)"
              Remove-Item -Recurse -Force $_.FullName 
            }
          }
          
          Write-Host "Package removal complete"
        }

    - name: Build Solution
      shell: pwsh
      run: |
        $artifactsPath = Join-Path $Env:GITHUB_WORKSPACE 'artifacts\logs'
        New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
        Write-Host "Artifacts path: $artifactsPath"
        
        $solutionPath = Join-Path $Env:GITHUB_WORKSPACE 'Qwiq.sln'
        $binlogPath = Join-Path $artifactsPath 'build.binlog'
        
        Write-Host "Building solution: $solutionPath"
        Write-Host "Binary log will be saved to: $binlogPath"
        
        # Build with standard settings
        msbuild "$solutionPath" /p:Configuration=Release /p:Platform="Any CPU" /p:WarningsNotAsErrors=NU1902 /verbosity:minimal /bl:"$binlogPath"
