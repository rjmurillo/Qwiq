name: Setup, Restore, and Build Solution
description: Sets up build tools, restores NuGet packages, and builds the solution (Windows only)

runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Initialize Environment
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}/init.ps1") {
          & "${{ github.workspace }}/init.ps1"
        }

    - name: Restore NuGet packages
      shell: pwsh
      run: nuget restore "${{ github.workspace }}/Qwiq.sln" -NonInteractive -DisableParallelProcessing

    - name: Build Solution
      shell: pwsh
      run: |
        $artifactsPath = Join-Path $Env:GITHUB_WORKSPACE 'artifacts\logs'
        New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
        Write-Host "Artifacts path: $artifactsPath"
        
        $solutionPath = Join-Path $Env:GITHUB_WORKSPACE 'Qwiq.sln'
        $binlogPath = Join-Path $artifactsPath 'build.binlog'
        
        Write-Host "Building solution: $solutionPath"
        Write-Host "Binary log will be saved to: $binlogPath"
        
        # Disable GitVersionTask to avoid MSBuild 17.x compatibility issues
        # The workflow already uses GitVersion.Tool separately, so this is redundant
        # Disable parallelism to avoid MSBuild engine races with older tasks
        msbuild "$solutionPath" /p:Configuration=Release /p:Platform="Any CPU" /p:WarningsNotAsErrors=NU1902 /p:GitVersionTaskBuildTools_CanCallDirectly=false /verbosity:minimal /m:1 /nr:false /p:BuildInParallel=false /p:UseSharedCompilation=false /bl:"$binlogPath"
