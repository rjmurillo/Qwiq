# CodeRabbit AI Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

reviews:
  # Ignore transient agent artifacts from code review
  path_filters:
    - "!.agents/**"

  # Review settings
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
